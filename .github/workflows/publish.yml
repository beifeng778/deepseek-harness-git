name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm run check
      - run: npm test
      # Trusted publishing (OIDC): configure the npm package's Trusted Publisher
      # for this repository and workflow before the first automated release.
      # The very first publish must be done manually; afterwards this workflow
      # publishes without an NPM_TOKEN secret.
      # `--provenance` requires a public repository and the id-token permission.
      - run: npm publish --provenance --access public
